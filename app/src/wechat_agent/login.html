<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeChat Agent | Sign In</title>
<style>
:root{font-family:"Segoe UI Variable","Segoe UI",sans-serif;color:#192a26;background:#f4f7f5;letter-spacing:0;--green:#087e55;--muted:#576961}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(150deg,#f4f7f5,#e9f0ed)}
header{border-bottom:1px solid #cddbd3;padding:22px 28px;display:flex;justify-content:space-between;gap:16px;align-items:center}header strong{font-size:18px}header span{font-size:13px;color:var(--muted)}
main{max-width:480px;margin:48px auto;padding:0 24px 40px}h1{font-family:Georgia,serif;font-size:34px;font-weight:400;margin:0 0 10px}p{line-height:1.5;color:var(--muted)}
.qr{width:min(100%,300px);aspect-ratio:1;background:white;border:1px solid #cddbd3;margin:30px auto 22px;display:grid;place-items:center;padding:16px}.qr img{width:100%;height:100%;object-fit:contain}.qr span{padding:12px;text-align:center;color:var(--muted)}[hidden]{display:none!important}
#status{text-align:center;min-height:48px;overflow-wrap:anywhere}button{font:inherit;border:1px solid #a4b9ac;background:white;color:#1e3930;padding:12px 18px;border-radius:6px;cursor:pointer;min-height:46px}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.55;cursor:wait}button:focus-visible{outline:3px solid #d9a03b;outline-offset:3px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}footer{margin-top:32px;font-size:12px;color:var(--muted);text-align:center}#error{color:#9b3027;overflow-wrap:anywhere}
@media(max-width:420px){header{padding:18px}main{margin-top:30px}h1{font-size:30px}}
</style>
<header><strong>WeChat Agent</strong><span id="server">Local server</span></header>
<main>
<h1>Sign in to WeChat</h1>
<p>Scan with WeChat and confirm on your phone.</p>
<div class="qr"><img id="qr" alt="WeChat sign-in QR code" hidden><span id="placeholder">Connecting to server...</span></div>
<p id="status" role="status" aria-live="polite">Preparing sign-in</p>
<p id="error" role="alert" hidden></p>
<div class="actions"><button class="primary" id="refresh" disabled>New QR code</button><button id="cancel" disabled>Cancel</button></div>
<footer>Private local sign-in</footer>
</main>
<script>
const fragment = new URLSearchParams(location.hash.slice(1));
const key = fragment.get('key') || sessionStorage.getItem('login-key');
if(key) sessionStorage.setItem('login-key',key);
history.replaceState(null,'',location.pathname);
const elements = Object.fromEntries(['server','qr','placeholder','status','error','refresh','cancel'].map(name=>[name,document.getElementById(name)]));
let session='',timer,version=0;
async function request(path,body){
 const response=await fetch(path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+(key||''),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
 const result=await response.json();
 if(!response.ok || result.error) throw new Error(result.error||'Server unavailable. Contact the administrator.');
 return result;
}
function failed(error){elements.error.hidden=false;elements.error.textContent=error.message;elements.status.textContent='Sign-in unavailable';elements.qr.hidden=true;elements.placeholder.hidden=false;elements.placeholder.textContent='Sign-in unavailable';elements.refresh.disabled=false;elements.cancel.disabled=!session;}
async function check(current){
 try{
  const result=await request('/api/confirm',{session});
  if(current!==version)return;
    if(result.status==='connected'){elements.status.textContent='Signed in. Account saved; the server is connecting automatically.';elements.qr.hidden=true;elements.placeholder.hidden=false;elements.placeholder.textContent='Signed in';elements.cancel.disabled=true;return;}
  if(['expired','cancelled'].includes(result.status)){elements.status.textContent='QR code expired. Request a new code.';elements.qr.hidden=true;elements.placeholder.hidden=false;elements.placeholder.textContent='Expired';return;}
  elements.status.textContent=result.status==='scaned'||result.status==='scanned'?'Confirm sign-in on your phone':'Waiting for scan';
  timer=setTimeout(()=>check(current),2000);
 }catch(error){if(current===version)failed(error);}
}
async function refresh(){
 const current=++version;clearTimeout(timer);elements.refresh.disabled=true;elements.cancel.disabled=true;elements.error.hidden=true;elements.qr.hidden=true;elements.placeholder.hidden=false;elements.placeholder.textContent='Creating QR code...';elements.status.textContent='Preparing sign-in';
 try{
  const state=await request('/api/status');elements.server.textContent='Server running';
  const result=await request('/api/qr',{session});
  if(current!==version)return;
  session=result.session;elements.qr.src=result.image;elements.qr.hidden=false;elements.placeholder.hidden=true;elements.status.textContent='Waiting for scan';elements.refresh.disabled=false;elements.cancel.disabled=false;timer=setTimeout(()=>check(current),2000);
 }catch(error){if(current===version)failed(error);}
}
elements.refresh.onclick=refresh;
elements.cancel.onclick=async()=>{++version;clearTimeout(timer);elements.cancel.disabled=true;try{await request('/api/cancel',{session});elements.status.textContent='Sign-in cancelled';elements.qr.hidden=true;elements.placeholder.hidden=false;elements.placeholder.textContent='Cancelled';}catch(error){failed(error);}};
if(key)refresh();else failed(new Error('Open login-wechat on the server to authorize this window.'));
</script>
</html>
